<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бронирование — Сладкие сны</title><link rel="stylesheet" href="assets/style.css"></head><body><header><a class="logo" href="index.html">Сладкие сны<small>Отдых, который начинается с улыбки</small></a><nav><a href="index.html">Главная</a><a href="catalog.html">Каталог</a></nav></header><main><h1>Бронирование номера</h1><form id="booking"><div class="formgrid"><label>Имя<input required name="first" pattern="[А-Яа-яЁёA-Za-z .-]+"></label><label>Фамилия<input required name="last" pattern="[А-Яа-яЁёA-Za-z .-]+"></label><label>Телефон<input required placeholder="+7(900)123-45-67" pattern="\+7\([0-9]{3}\)[0-9]{3}-[0-9]{2}-[0-9]{2}"></label><label>E-mail<input required type="email"></label><label>Дата заезда<input required type="date"></label><label>Дата выезда<input required type="date"></label></div><button class="btn">Отправить заявку</button><p id="message"></p></form></main><footer>© Гостиница «Сладкие сны»</footer><script>document.querySelector('#booking').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#message').textContent='Прототип: данные проверены браузером, заявка демонстрационная.'})</script></body></html>
